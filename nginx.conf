# ── Old-brand domains → 301 to canonical ─────────────────────
# newageboilers.com, newageboilerinstallations.com and newage.plumbing were the
# previous trading identity (New Age Boiler Installations Ltd). IONOS forwarding
# served them as a 302 (temporary, so link equity never consolidates) and had
# no certificate, so https:// failed outright and those inbound links dead-ended.
# Yell alone still has ~40 live links pointing at the old brand.
#
# This block MUST be deployed BEFORE the domains are pointed here or added in
# Coolify. The main server below is server_name _ (catch-all), so without it
# these three domains would each serve a full duplicate copy of the site, which
# is worse for us than the broken 302 we are replacing.
#
# Redirects to the homepage rather than preserving $request_uri: the old sites'
# paths do not exist on this one, so carrying them over would turn every
# inbound link into a 404.
server {
    listen 80;
    server_name newageboilers.com www.newageboilers.com
                newageboilerinstallations.com www.newageboilerinstallations.com
                newage.plumbing www.newage.plumbing;

    # TLS terminates at the Coolify proxy, so $scheme is always http in here.
    # Hardcode https so the redirect lands on the canonical secure origin.
    return 301 https://bettercallwes.co.uk/;
}

server {
    # default_server is load-bearing. server_name _ matches nothing: it only
    # ever worked because this was the sole block on port 80 and therefore the
    # implicit default. Once the old-brand redirect block above was added it
    # became the first block and inherited that role, so every request for
    # bettercallwes.co.uk fell through to it and 301'd to itself. Infinite loop,
    # site down. Marking this block explicitly as the default fixes it whatever
    # order the blocks appear in.
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # TLS terminates at the proxy, so nginx only ever sees http and would
    # build "http://..." Location headers, bouncing every redirect through an
    # extra hop. Relative Location headers resolve against the request scheme.
    absolute_redirect off;

    # ── Compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/html
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Static assets — long cache (images, fonts, css, js) ──────
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── HTML pages — short cache so updates go live quickly ───────
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Short self-scheduling links ──────────────────────────────
    # Contract customers (YourRepair/Hometree) get an SMS or WhatsApp
    # button pointing at /s/<token>, where <token> is a 35-char signed
    # blob identifying an existing SM8 job. Kept short deliberately: the
    # long form pushed the SMS to three billed segments and looked like
    # phishing. Internal rewrite (not a redirect) so the token never shows
    # up in a Location header or the address bar as a query string.
    # Quoted deliberately: nginx parses an unquoted "}" as the end of a
    # config block, so a regex with a {20,} repeat count breaks the whole
    # file and the container never starts. Cost me a site outage once.
    rewrite "^/s/([A-Za-z0-9_-]{20,})/?$" /schedule.html?t=$1 last;

    # ── Legacy redirects ─────────────────────────────────────────
    # /locations/chandler-s-ford(.html) was a duplicate of chandlers-ford.
    rewrite ^/locations/chandler-s-ford(\.html)?/?$ /locations/chandlers-ford.html permanent;

    # 2026-08-09: five pages were competing for boiler-install intent, so
    # Google ranked none of them. Merged into /services/boiler-installation.html.
    rewrite ^/services/(boiler-fitting|new-boiler|boiler-systems|combi-boiler-installations)(\.html)?/?$ /services/boiler-installation.html permanent;

    # 2026-08-09: same-intent service-page twins, merged into the sibling that
    # GSC showed actually earning the impressions.
    rewrite ^/services/taps(\.html)?/?$                /services/tap-repair.html       permanent;
    rewrite ^/services/toilet-repair(\.html)?/?$       /services/toilet-repairs.html   permanent;
    rewrite ^/services/showers(\.html)?/?$             /services/shower-repair.html    permanent;
    rewrite ^/services/smart-controls(\.html)?/?$      /services/heating-controls.html permanent;
    rewrite ^/services/system-flushing(\.html)?/?$     /services/power-flushing.html   permanent;
    rewrite ^/services/small-plumbing-jobs(\.html)?/?$ /services/plumbing-repairs.html permanent;
    rewrite ^/services/gas-services(\.html)?/?$        /services/gas-safety-check.html permanent;

    # ── Main routing ─────────────────────────────────────────────
    # Check .html BEFORE the directory: /services has both
    # /services.html AND a /services/ subdir without index.html,
    # so $uri/ would resolve to the dir and 403.
    location / {
        # try_files used to serve /services/power-flushing and
        # /services/power-flushing.html as two 200s with the same content. The
        # canonical tag is only a hint, and GSC confirmed Google was indexing and
        # ranking both forms separately, so every page competed with itself.
        # Send the extensionless form to the .html one whenever that file exists.
        if (-f $document_root$uri.html) {
            return 301 $uri.html$is_args$args;
        }
        try_files $uri $uri.html $uri/ =404;
    }

    # ── Custom 404 page ──────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Sitemap and robots — no cache ────────────────────────────
    location ~* \.(xml|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
