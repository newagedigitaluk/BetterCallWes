server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # TLS terminates at the proxy, so nginx only ever sees http and would
    # build "http://..." Location headers, bouncing every redirect through an
    # extra hop. Relative Location headers resolve against the request scheme.
    absolute_redirect off;

    # ── Compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/html
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Static assets — long cache (images, fonts, css, js) ──────
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── HTML pages — short cache so updates go live quickly ───────
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Short self-scheduling links ──────────────────────────────
    # Contract customers (YourRepair/Hometree) get an SMS or WhatsApp
    # button pointing at /s/<token>, where <token> is a 35-char signed
    # blob identifying an existing SM8 job. Kept short deliberately: the
    # long form pushed the SMS to three billed segments and looked like
    # phishing. Internal rewrite (not a redirect) so the token never shows
    # up in a Location header or the address bar as a query string.
    rewrite ^/s/([A-Za-z0-9_-]{20,})/?$ /schedule.html?t=$1 last;

    # ── Legacy redirects ─────────────────────────────────────────
    # /locations/chandler-s-ford(.html) was a duplicate of chandlers-ford.
    rewrite ^/locations/chandler-s-ford(\.html)?/?$ /locations/chandlers-ford.html permanent;

    # 2026-08-09: five pages were competing for boiler-install intent, so
    # Google ranked none of them. Merged into /services/boiler-installation.html.
    rewrite ^/services/(boiler-fitting|new-boiler|boiler-systems|combi-boiler-installations)(\.html)?/?$ /services/boiler-installation.html permanent;

    # 2026-08-09: same-intent service-page twins, merged into the sibling that
    # GSC showed actually earning the impressions.
    rewrite ^/services/taps(\.html)?/?$                /services/tap-repair.html       permanent;
    rewrite ^/services/toilet-repair(\.html)?/?$       /services/toilet-repairs.html   permanent;
    rewrite ^/services/showers(\.html)?/?$             /services/shower-repair.html    permanent;
    rewrite ^/services/smart-controls(\.html)?/?$      /services/heating-controls.html permanent;
    rewrite ^/services/system-flushing(\.html)?/?$     /services/power-flushing.html   permanent;
    rewrite ^/services/small-plumbing-jobs(\.html)?/?$ /services/plumbing-repairs.html permanent;
    rewrite ^/services/gas-services(\.html)?/?$        /services/gas-safety-check.html permanent;

    # ── Main routing ─────────────────────────────────────────────
    # Check .html BEFORE the directory: /services has both
    # /services.html AND a /services/ subdir without index.html,
    # so $uri/ would resolve to the dir and 403.
    location / {
        # try_files used to serve /services/power-flushing and
        # /services/power-flushing.html as two 200s with the same content. The
        # canonical tag is only a hint, and GSC confirmed Google was indexing and
        # ranking both forms separately, so every page competed with itself.
        # Send the extensionless form to the .html one whenever that file exists.
        if (-f $document_root$uri.html) {
            return 301 $uri.html$is_args$args;
        }
        try_files $uri $uri.html $uri/ =404;
    }

    # ── Custom 404 page ──────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Sitemap and robots — no cache ────────────────────────────
    location ~* \.(xml|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
